name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The integration tests start the web client through the app host, as `dotnet run` does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create a development certificate
        run: dotnet dev-certs https

      - name: Build
        run: dotnet build Sofa.slnx --configuration Release

      - name: Check the App Gateway's OpenAPI description is committed
        run: git diff --exit-code -- web/openapi

      - name: Test
        run: dotnet test --solution Sofa.slnx --configuration Release --no-build
        env:
          SOFA_TEST_RESOURCE_LOGS: "1"

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Check the API client matches the OpenAPI description
        run: |
          npm run generate:api
          git diff --exit-code -- src/api

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
